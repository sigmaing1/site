<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff">
  <title>Sajt je u izradi</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #17324d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(147, 197, 253, 0.42), transparent 42%),
        radial-gradient(ellipse at 85% 85%, rgba(186, 230, 253, 0.55), transparent 40%),
        linear-gradient(135deg, #f8fbff, #eaf4ff);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(36px, 8vw, 72px) clamp(24px, 7vw, 64px);
      text-align: center;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(55, 100, 150, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.12;
      letter-spacing: -0.045em;
    }

    p {
      margin: 18px 0 0;
      color: #55708b;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sajt je u izradi</h1>
    <p>Hvala na strpljenju.</p>
  </main>
</body>
</html>
